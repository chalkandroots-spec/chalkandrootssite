<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Chalk & Roots Celebration</title><style>body{margin:0;padding:8vh 7vw;background:#f7f3e8;color:#244d3f;font:18px/1.6 system-ui}button{font:inherit;padding:10px 18px;cursor:pointer}a{color:inherit}</style><h1>Chalk & Roots Celebration</h1><p id="loading" role="status">Loading your celebration, audio, and activities…</p><p>Please keep this tab open while the presentation loads.</p><button onclick="location.reload()" hidden id="retry">Try again</button><script>
(async()=>{try{
const parts=await Promise.all([0,1,2,3].map(async n=>{
const r=await fetch('/celebration/presentation-'+n+'.txt');
if(!r.ok)throw new Error('The presentation could not be loaded.');
return r.text();
}));
const html=parts.join('');
if(!html.startsWith('<!doctype html>')||!html.includes('async function playOpening()'))throw new Error('Incomplete presentation.');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='The online backup could not load. Try again, or use your downloaded presentation.';document.getElementById('retry').hidden=false;}
})();</script></html>
